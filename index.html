<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Akshar Aeinampudi, software developer. Live demos of Outlier, GitHub Ecosystem Analyzer and Internship Tracker." />
  <meta property="og:title" content="Portfolio" />
  <meta property="og:description" content="Quick demos and links to my projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#projects">Skip to projects</a>

  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="logo" id="logo"></a>
      <nav class="nav-links">
        <a href="#projects">Projects</a>
        <a href="#repos" id="nav-repos">Repos</a>
        <a href="#contact">Contact</a>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="eyebrow mono" id="hero-role"></p>
      <h1 id="hero-name"></h1>
      <p class="lead" id="hero-tagline"></p>
      <div class="cta" id="hero-cta"></div>
      <ul class="skills" id="skills"></ul>
    </section>

    <section id="projects" class="wrap section">
      <div class="section-head">
        <h2>Featured projects</h2>
        <div class="filters" id="filters" role="tablist" aria-label="Filter projects by tag"></div>
      </div>
      <div class="grid" id="project-grid"></div>
    </section>

    <section id="repos" class="wrap section">
      <div class="section-head">
        <h2>All repositories</h2>
        <a class="link-arrow" id="all-repos-link" target="_blank" rel="noopener">View on GitHub →</a>
      </div>
      <div class="repo-list" id="repo-list"><p class="muted">Loading repositories…</p></div>
    </section>

    <section id="contact" class="wrap section contact">
      <h2>Let's talk</h2>
      <p class="lead">Open to internships, full-time roles and interesting collaborations.</p>
      <div class="cta" id="contact-cta"></div>
    </section>
  </main>

  <footer class="wrap footer muted">
    <span id="footer-text"></span>
  </footer>

  <dialog id="demo-modal" aria-labelledby="modal-title">
    <div class="modal-inner">
      <button class="icon-btn modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-media" id="modal-media"></div>
      <div class="modal-body">
        <p class="modal-note" id="modal-note" hidden></p>
        <h3 id="modal-title"></h3>
        <p id="modal-summary"></p>
        <ul id="modal-highlights"></ul>
        <div class="tags" id="modal-tags"></div>
        <div class="cta" id="modal-cta"></div>
      </div>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
